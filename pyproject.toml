[tool.poetry]
name = "flow"
version = "0.1.0"
description = "Universal Flow Engine (V-Next) - An AI-agnostic, fractal workflow orchestrator."
authors = ["Flow Manager Team"]
readme = "README.md"
packages = [{include = "flow", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.12.5"
jinja2 = "^3.1.6"
typer = {extras = ["all"], version = "^0.21.1"}
pathspec = "^0.12.1"
rich = "^14.2.0"
chromadb = "^0.4.22"
tenacity = "^9.1.4"
tree-sitter = "^0.25.2"
tree-sitter-python = "^0.25.0"
tree-sitter-javascript = "^0.25.0"
numpy = "<2.0"

# Optional Dependencies (Providers)
google-genai = { version = "^1.0.0", optional = true }
openai = { version = "^1.12.0", optional = true }
anthropic = { version = "^0.79.0", optional = true }
ollama = { version = "^0.6.1", optional = true }

[tool.poetry.extras]
google = ["google-genai"]
openai = ["openai"]
anthropic = ["anthropic"]
ollama = ["ollama"]
all = ["google-genai", "openai", "anthropic", "ollama"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^5.0.0"
mypy = "^1.0.0"
lizard = "^1.17.10"
psutil = "^7.2.2"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line_length = 88
